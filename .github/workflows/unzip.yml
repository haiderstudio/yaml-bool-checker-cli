name: Unzip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip archive and publish contents
        run: |
          set -e
          ZIP=$(ls *.zip | head -n 1)
          echo "Zip file: $ZIP"
          unzip -o "$ZIP"
          PROJ=""
          for d in */; do
            if [ -f "${d}README.md" ] && [ -d "${d}src" ]; then
              PROJ="$d"
              break
            fi
          done
          if [ -n "$PROJ" ]; then
            echo "Project folder: $PROJ"
            CI_PATH="${PROJ}.github/workflows/ci.yml"
          elif [ -f "README.md" ] && [ -d "src" ]; then
            echo "Project files are already at the repo root."
            PROJ="./"
            CI_PATH=".github/workflows/ci.yml"
          else
            echo "ERROR: could not find a folder containing both README.md and src/"
            find . -maxdepth 3 | sort
            exit 1
          fi
          if [ -f "$CI_PATH" ]; then
            echo "===== BEGIN .github/workflows/ci.yml ====="
            cat "$CI_PATH"
            echo "===== END .github/workflows/ci.yml ====="
          else
            echo "WARNING: no .github/workflows/ci.yml found in the zip"
          fi
          if [ "$PROJ" != "./" ]; then
            if [ -d "${PROJ}.github" ]; then
              mkdir -p .github/workflows
              if [ -d "${PROJ}.github/workflows" ]; then
                for f in "${PROJ}.github/workflows/"*; do
                  [ -e "$f" ] || continue
                  if [ "$(basename "$f")" = "ci.yml" ]; then
                    echo "Skipping ci.yml (will be recreated via the web UI)"
                    continue
                  fi
                  mv "$f" .github/workflows/
                done
              fi
              shopt -s dotglob nullglob
              for item in "${PROJ}.github/"*; do
                [ -e "$item" ] || continue
                case "$(basename "$item")" in workflows) continue;; esac
                mv "$item" .github/
              done
              shopt -u dotglob nullglob
              rmdir "${PROJ}.github/workflows" 2>/dev/null || true
              rmdir "${PROJ}.github" 2>/dev/null || true
            fi
            shopt -s dotglob nullglob
            for item in "${PROJ}"*; do
              [ -e "$item" ] || continue
              case "$(basename "$item")" in .github|.git) continue;; esac
              mv "$item" ./
            done
            shopt -u dotglob nullglob
            rm -rf "$PROJ"
          else
            rm -f .github/workflows/ci.yml
          fi
          rm -f "$ZIP"
          ls -la
          git status --short
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Unzip project files" || echo "Nothing to commit"
          git push
